<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - ProjectMan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts (Outfit) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Auth Script (guards this admin-only page) -->
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Container (will be loaded dynamically) -->
    <div id="sidebar-container"></div>

    <!-- Main Content Panel -->
    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="fw-bold mb-1">User Management</h1>
          <p class="text-muted small mb-0">Create new user accounts and manage active members</p>
        </div>
      </div>

      <div class="row g-4">
        <!-- User Form Column -->
        <div class="col-lg-4">
          <div class="card glass-panel text-white p-4">
            <h4 class="fw-bold mb-3"><i class="bi bi-person-plus"></i> Add New User</h4>
            
            <div id="user-form-alert" class="alert alert-danger d-none py-2 px-3 small border-0 bg-danger bg-opacity-25 text-danger mb-3" role="alert">
              Error creating user.
            </div>
            
            <form id="add-user-form">
              <div class="mb-3">
                <label for="new-username" class="form-label form-label-custom small">Username</label>
                <input type="text" class="form-control form-control-custom" id="new-username" placeholder="e.g. JohnDoe" required autocomplete="off">
              </div>
              
              <div class="mb-3">
                <label for="new-password" class="form-label form-label-custom small">Password</label>
                <input type="password" class="form-control form-control-custom" id="new-password" placeholder="Password" required autocomplete="new-password">
              </div>

              <div class="mb-4">
                <label for="new-role" class="form-label form-label-custom small">System Role</label>
                <select class="form-select form-control-custom" id="new-role">
                  <option value="user" selected>Regular User</option>
                  <option value="admin">System Admin</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 py-2 d-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-plus-lg"></i> <span>Create User</span>
              </button>
            </form>
          </div>
        </div>

        <!-- Users List Column -->
        <div class="col-lg-8">
          <div class="card glass-panel text-white p-4">
            <h4 class="fw-bold mb-3"><i class="bi bi-people"></i> Registered Users</h4>
            
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle mb-0" style="--bs-table-bg: transparent; --bs-table-hover-bg: rgba(255, 255, 255, 0.03);">
                <thead>
                  <tr style="border-bottom: 1px solid var(--border-color);">
                    <th scope="col" class="text-muted py-3 small fw-semibold">USERNAME</th>
                    <th scope="col" class="text-muted py-3 small fw-semibold">ROLE</th>
                    <th scope="col" class="text-muted py-3 small fw-semibold text-end">ACTIONS</th>
                  </tr>
                </thead>
                <tbody id="users-table-body">
                  <tr>
                    <td colspan="3" class="text-center py-4 text-muted">
                      <div class="spinner-border spinner-border-sm text-cyan me-2" role="status"></div> Loading users...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Sidebar Loader Script -->
  <script src="js/sidebar.js"></script>
  <!-- User Management Logic Script -->
  <script src="js/users.js"></script>
</body>
</html>
