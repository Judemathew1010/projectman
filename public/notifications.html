<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - ProjectMan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
        <div>
          <h1 class="fw-bold mb-1">Notifications</h1>
          <p class="text-muted small mb-0">Due dates, new work, and recent updates across projects and tickets</p>
        </div>
        <button id="refresh-notifications-btn" class="btn btn-secondary-custom btn-sm d-flex align-items-center gap-2 py-2 px-3">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>

      <div id="notifications-summary" class="notification-summary mb-4"></div>

      <div class="notification-grid">
        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-calendar-event"></i> Task Due Dates</h5>
            <span id="task-due-count" class="notification-count">0</span>
          </div>
          <div id="task-due-list" class="notification-list"></div>
        </section>

        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-diagram-3"></i> Subtask Due Dates</h5>
            <span id="subtask-due-count" class="notification-count">0</span>
          </div>
          <div id="subtask-due-list" class="notification-list"></div>
        </section>

        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-plus-circle"></i> New Tasks</h5>
            <span id="new-task-count" class="notification-count">0</span>
          </div>
          <div id="new-task-list" class="notification-list"></div>
        </section>

        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-pencil-square"></i> Task Updates</h5>
            <span id="task-update-count" class="notification-count">0</span>
          </div>
          <div id="task-update-list" class="notification-list"></div>
        </section>

        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-calendar-check"></i> Ticket Due Dates</h5>
            <span id="ticket-due-count" class="notification-count">0</span>
          </div>
          <div id="ticket-due-list" class="notification-list"></div>
        </section>

        <section class="notification-section">
          <div class="notification-section-header">
            <h5><i class="bi bi-plus-square"></i> New Tickets</h5>
            <span id="new-ticket-count" class="notification-count">0</span>
          </div>
          <div id="new-ticket-list" class="notification-list"></div>
        </section>

        <section class="notification-section notification-section-wide">
          <div class="notification-section-header">
            <h5><i class="bi bi-journal-text"></i> Ticket Updates</h5>
            <span id="ticket-update-count" class="notification-count">0</span>
          </div>
          <div id="ticket-update-list" class="notification-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
