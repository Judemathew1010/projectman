<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trello Task Board - ProjectMan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts (Outfit) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- SortableJS (for dragging cards) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <!-- Auth Script -->
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content Panel -->
    <div class="main-content d-flex flex-column" style="height: 100vh; overflow: hidden;">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4 flex-shrink-0">
        <div>
          <h1 class="fw-bold mb-1">Task Board (Trello)</h1>
          <p class="text-muted small mb-0">Drag and drop tickets to manage day-to-day workflow tasks</p>
        </div>
        
        <div class="d-flex align-items-center gap-2 w-100 w-md-auto">
          <span class="text-muted small text-nowrap"><i class="bi bi-briefcase"></i> Project:</span>
          <select id="trello-project-selector" class="form-select form-control-custom form-select-sm" style="width: 220px;">
            <option value="">-- Select Project --</option>
          </select>
        </div>
      </div>

      <!-- Trello Workspace -->
      <div id="trello-workspace" class="flex-grow-1 d-none" style="overflow-y: hidden; display: flex; flex-direction: column;">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
          <div>
            <h4 id="trello-project-name" class="fw-bold text-white mb-0">Project Name</h4>
          </div>
        </div>

        <!-- Kanban Board flex wrapper (horizontal scrolling) -->
        <div class="flex-grow-1" style="overflow: auto; min-height: 0;">
          <div class="kanban-board-container" id="kanban-board">
            <!-- Columns populated dynamically -->

            <!-- Static "Add Column" card at the end -->
            <div class="kanban-column justify-content-center border-dashed" style="border: 2px dashed var(--border-color); background: transparent; cursor: pointer; min-height: 150px; flex: 0 0 280px; width: 280px;" id="add-column-trigger" onclick="showAddColumnInput()">
              <div id="add-column-btn-content" class="text-center text-muted py-4">
                <i class="bi bi-plus-circle fs-3 d-block mb-2"></i>
                <span class="fw-semibold">Add Column</span>
              </div>
              <div id="add-column-form-content" class="d-none w-100">
                <form id="add-column-form">
                  <div class="mb-2">
                    <input type="text" id="new-column-title" class="form-control form-control-custom form-control-sm" placeholder="Column Title..." required autocomplete="off">
                  </div>
                  <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom btn-sm py-1.5 px-3">Add</button>
                    <button type="button" class="btn btn-secondary-custom btn-sm py-1.5 px-3" onclick="hideAddColumnInput(event)">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Select project warning -->
      <div id="trello-select-project-state" class="card glass-panel p-5 text-center text-white flex-shrink-0">
        <i class="bi bi-layout-three-columns fs-1 mb-3 text-cyan"></i>
        <h4 class="fw-bold">No Active Project</h4>
        <p class="text-muted max-width-500 mx-auto">Please select a project from the top dropdown to view its Kanban task board.</p>
      </div>
    </div>
  </div>

  <!-- ADD TICKET MODAL -->
  <div class="modal fade" id="addTicketModal" tabindex="-1" aria-labelledby="addTicketModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel text-white border border-secondary border-opacity-25" style="background: rgba(20, 26, 42, 0.95);">
        <div class="modal-header border-bottom border-secondary border-opacity-25">
          <h5 class="modal-title fw-bold" id="addTicketModalLabel"><i class="bi bi-plus-circle"></i> Create New Ticket</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="add-ticket-form">
          <input type="hidden" id="add-ticket-column-id">
          <div class="modal-body">
            <div id="ticket-error-alert" class="alert alert-danger d-none py-2 px-3 small border-0 bg-danger bg-opacity-25 text-danger mb-3"></div>

            <div class="mb-3">
              <label for="ticket-title" class="form-label form-label-custom small">Title</label>
              <input type="text" class="form-control form-control-custom" id="ticket-title" placeholder="e.g. Implement Login Route" required autocomplete="off">
            </div>

            <div class="mb-3">
              <label for="ticket-desc" class="form-label form-label-custom small">Description</label>
              <textarea class="form-control form-control-custom" id="ticket-desc" rows="3" placeholder="Provide detailed steps or context"></textarea>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="ticket-due" class="form-label form-label-custom small">Due Date & Time</label>
                <input type="datetime-local" class="form-control form-control-custom" id="ticket-due">
              </div>
              <div class="col-md-6">
                <label for="ticket-image" class="form-label form-label-custom small">Attach Images</label>
                <input type="file" class="form-control form-control-custom" id="ticket-image" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.heic,.heif,.avif,.tif,.tiff,.ico" multiple>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label for="ticket-assignee" class="form-label form-label-custom small">Assignee</label>
                <select class="form-select form-control-custom" id="ticket-assignee">
                  <option value="">Unassigned</option>
                  <!-- Populated dynamically -->
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="ticket-priority" class="form-label form-label-custom small">Priority</label>
                <select class="form-select form-control-custom" id="ticket-priority">
                  <option value="low" selected>Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top border-secondary border-opacity-25">
            <button type="button" class="btn btn-secondary-custom btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom btn-sm px-4 py-2">Add Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- VIEW / EDIT / DELETE TICKET MODAL -->
  <div class="modal fade" id="editTicketModal" tabindex="-1" aria-labelledby="editTicketModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-panel text-white border border-secondary border-opacity-25" style="background: rgba(20, 26, 42, 0.95);">
        <div class="modal-header border-bottom border-secondary border-opacity-25">
          <h5 class="modal-title fw-bold" id="editTicketModalLabel"><i class="bi bi-journal-bookmark"></i> Ticket Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-ticket-form">
          <input type="hidden" id="edit-ticket-id">
          <input type="hidden" id="edit-ticket-column-id">
          <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
            <div id="edit-ticket-error-alert" class="alert alert-danger d-none py-2 px-3 small border-0 bg-danger bg-opacity-25 text-danger mb-3"></div>

            <div class="mb-3">
              <label for="edit-ticket-title" class="form-label form-label-custom small">Title</label>
              <input type="text" class="form-control form-control-custom" id="edit-ticket-title" required autocomplete="off">
            </div>

            <div class="mb-3">
              <label for="edit-ticket-desc" class="form-label form-label-custom small">Description</label>
              <textarea class="form-control form-control-custom" id="edit-ticket-desc" rows="2"></textarea>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="edit-ticket-due" class="form-label form-label-custom small">Due Date & Time</label>
                <input type="datetime-local" class="form-control form-control-custom" id="edit-ticket-due">
              </div>
              <div class="col-md-6">
                <label for="edit-ticket-image" class="form-label form-label-custom small">Attach New Images</label>
                <input type="file" class="form-control form-control-custom" id="edit-ticket-image" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.heic,.heif,.avif,.tif,.tiff,.ico" multiple>
              </div>
            </div>

            <!-- Uploaded Image Gallery -->
            <div class="mb-3">
              <label class="form-label form-label-custom small d-block">Attached Images (Click to open)</label>
              <div id="edit-ticket-image-gallery" class="ticket-gallery">
                <!-- Thumbnail images go here -->
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="edit-ticket-assignee" class="form-label form-label-custom small">Assignee</label>
                <select class="form-select form-control-custom" id="edit-ticket-assignee">
                  <option value="">Unassigned</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="edit-ticket-priority" class="form-label form-label-custom small">Priority</label>
                <select class="form-select form-control-custom" id="edit-ticket-priority">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>

            <!-- Comments Section -->
            <div class="comments-section">
              <h6 class="fw-bold mb-2 small"><i class="bi bi-chat-left-text"></i> Comments & Activity Thread</h6>
              <div id="edit-ticket-comments-list" class="comments-list">
                <!-- Populated via JS -->
              </div>
              <div class="d-flex gap-2">
                <textarea id="new-comment-text" class="form-control form-control-custom form-control-sm" rows="1" placeholder="Write a comment..."></textarea>
                <button type="button" id="post-comment-btn" class="btn btn-primary-custom btn-sm py-1.5 px-3">Post</button>
              </div>
            </div>

          </div>
          <div class="modal-footer border-top border-secondary border-opacity-25 justify-content-between">
            <button type="button" id="delete-ticket-btn" class="btn btn-danger btn-sm bg-opacity-10 border-danger border-opacity-25 text-danger px-3 py-2">
              <i class="bi bi-trash"></i> Remove Ticket
            </button>
            <div>
              <button type="button" class="btn btn-secondary-custom btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-custom btn-sm px-4 py-2">Save Changes</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Sidebar Loader Script -->
  <script src="js/sidebar.js"></script>
  <!-- Trello Logic Script -->
  <script src="js/trello.js"></script>
</body>
</html>
