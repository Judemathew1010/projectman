<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071328">
  <title>Automatic Workflows — ProjectMan</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071328;
    }

    .site-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      display: grid;
      min-height: 100%;
      place-items: center;
      padding: 2rem;
      color: #f5f8ff;
      background: #071328;
      font: 500 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }

    .fallback a {
      color: #62d4ff;
    }
  </style>
</head>
<body>
  <iframe
    class="site-frame"
    src="https://automatic-workflows2.vercel.app/"
    title="Automatic Workflows"
    allow="fullscreen"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <noscript>
    <div class="fallback">
      JavaScript is required to view Automatic Workflows. <a href="https://automatic-workflows2.vercel.app/">Open the site directly</a>.
    </div>
  </noscript>
</body>
</html>
