<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ProjectMan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts (Outfit) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Auth Script (runs immediately to check auth status) -->
  <script src="js/auth.js"></script>
</head>
<body class="login-container">

  <div class="card login-card glass-panel text-white">
    <div class="text-center mb-4">
      <h2 class="fw-extrabold mb-1 text-white" style="font-weight: 800; letter-spacing: 0;">
        <i class="bi bi-kanban"></i> ProjectMan
      </h2>
      <p class="text-muted small">Sign in to manage projects and availability</p>
    </div>

    <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small border-0 bg-danger bg-opacity-25 text-danger-emphasis mb-3" role="alert">
      Invalid username or password.
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label form-label-custom small">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control form-control-custom" id="username" placeholder="Enter username" required autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label form-label-custom small">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-custom" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn login-btn w-100 py-2.5 rounded-3 d-flex justify-content-center align-items-center gap-2">
        <span>Sign In</span> <i class="bi bi-arrow-right"></i>
      </button>
    </form>
  </div>

  <!-- Login Logic Script -->
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const alertEl = document.getElementById('login-alert');
      
      alertEl.classList.add('d-none');
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          alertEl.textContent = data.error || 'Authentication failed';
          alertEl.classList.remove('d-none');
          return;
        }
        
        // Save current user info
        setCurrentUser(data);
        
        // Redirect to main panel
        window.location.href = 'calendar.html';
      } catch (err) {
        console.error('Login error:', err);
        alertEl.textContent = 'Server connection error. Please try again.';
        alertEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
